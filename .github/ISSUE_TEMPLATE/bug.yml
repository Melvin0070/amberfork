name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A command sequence beats a description. Exit codes are diff(1)-style — 0 converged, 1 forked, 2 trouble.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `amberfork --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64 / Ubuntu 24.04 x86_64
