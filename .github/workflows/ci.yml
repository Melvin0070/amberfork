name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: spike smoke (aligner sanity, offline)
        run: python3 spike/test_smoke.py
      # GAIA-sanitizer invariants moved into `cargo test` with the Rust port (issue #17):
      # unit tests in amberfork-bench/src/sanitize.rs + the committed-fixture round trip.
      - name: rust checks (auto-armed once Cargo.toml exists)
        run: |
          if [ -f Cargo.toml ]; then
            rustup toolchain install stable --profile minimal --component rustfmt,clippy
            cargo fmt --all --check
            cargo clippy --all-targets --workspace -- -D warnings
            cargo test --workspace
          else
            echo "no Cargo.toml yet — rust checks skipped (this step arms itself when the workspace lands)"
          fi

  # The published crates declare `rust-version`; this is what keeps that declaration true. It
  # was false once (1.85 declared, let-chains used — which need 1.88) and nothing noticed.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: check on the declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked

  # Licences, RustSec advisories and dependency sources, for both workspaces (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ui/Cargo.toml
